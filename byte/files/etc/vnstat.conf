# vnStat configuration -- AW1000_NSS_BYTE override.
#
# The package default is /var/lib/vnstat, which lives on the tmpfs overlay
# that is rebuilt from the squashfs on every boot: the database (and with it
# every month/year total) is gone after a reboot. Keeping it in /etc/vnstat
# puts it in the persistent overlay, so history survives reboots and
# sysupgrades.
#
# Everything not set here keeps vnStat's own default (a missing option means
# "use the built-in value"), so this file only carries what we change.

# location of the database directory
DatabaseDir "/etc/vnstat"

# Interface: leave automatic. byte/files/etc/config/vnstat lists br-lan
# explicitly, which is what the LuCI page graphs.
;Interface ""

# locale (LC_ALL) ("-" = use system locale)
;Locale "-"

# date output formats for -d, -m, -t and -w
;DayFormat    "%Y-%m-%d"
;MonthFormat  "%Y-%m"
;TopFormat    "%Y-%m-%d"

# characters used for visual bars in the output
;RXCharacter       "%"
;TXCharacter       ":"
;RXHourCharacter   "r"
;TXHourCharacter   "t"

# how units are prefixed when traffic is shown
# 0 = IEC standard prefixes (KiB/MiB/GiB...)
# 1 = old style prefixes used by earlier versions (KB/MB/GB...)
# 2 = SI decimal prefixes (kB/MB/GB...)
;UnitMode 0

# use binary (1024) or decimal (1000) multipliers
;RateUnit 1
;OutputStyle 0

# maximum number of decimals to use in outputs
;DefaultDecimals 2

# select padding for the number columns of the output
;ColumnPadding 4

# try to detect locale for output and interface names
;UseLocale 1

# timezone used for timestamps
;TimeSync 1

# how often (in seconds) vnstatd updates the database
;UpdateInterval 30

# how often (in seconds) vnstatd writes changes to disk
;SaveInterval 5

# days kept in the database (0 = forever)
;DailyDays 62
;MonthlyMonths 25
;YearlyYears 0
;TopDays 0

# how much data is kept per hour/day/month
;5MinuteHours 4
;HourlyHours 4

# days after which an interface with no traffic is removed (0 = never)
;RemoveDays 0

# how often (in seconds) the interface list is checked for new/removed
;PollInterval 5

# bandwidth detection
;BandwidthDetection 1
;MaxBandwidth 1000

# file mode of the database
;DatabaseWriteMode 0
