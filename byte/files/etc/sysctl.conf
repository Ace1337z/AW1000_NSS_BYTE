# ================================================================
# AW1000_NSS_BYTE -- sysctl tuning for the AW1000 (IPQ8071A, 884 MB RAM)
#
# Tuning philosophy: stability first, then throughput.
#
# The link is 5G NSA (~100-300 Mbit/s typical). Buffer sizes are sized from
# the bandwidth-delay product of that link, not from server-class defaults:
#
#   300 Mbit/s x 60 ms worst-case RTT = ~2.25 MB
#   4 MB cap gives ~1.8x headroom for burst absorption.
#
# Anything larger is pure waste: per-socket caps are only *limits*, but
# they let badly-behaved or many-socket workloads pin memory that the
# kernel then cannot reclaim fast enough, which is the classic cause of
# router OOM under load (and OOM-killing dnscache/xray is what actually
# drops a user's internet).
# ================================================================

# ---- queue discipline ------------------------------------------
# fq + bbr: fq keeps the queue short and paces, bbr does not collapse on the
# bufferbloat a cellular uplink always has.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- TCP fast open ---------------------------------------------
# 3 = enable for both outgoing connect() and incoming SYN-carrying data.
# The client side (1) helps repeat visits to the same host; the server side
# (2) helps anything connecting *to* this box. Both are additive, so 3.
net.ipv4.tcp_fastopen = 3
# Fast open only pays off if the kernel remembers the cookies; the default
# blackhole timeout of 60s is fine, and tcp_fastopen_key stays random.
net.ipv4.tcp_fastopen_blackhole_timeout_sec = 0

# ---- socket buffers --------------------------------------------
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 131072 4194304
net.ipv4.tcp_wmem = 4096 16384 4194304

# ---- MTU / PMTU ------------------------------------------------
# Cellular bearers blackhole full-size packets often enough that probing is
# worth the cost. Without it, a tunnel or VPN over the modem stalls on any
# packet larger than the path MTU.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024
# Do not reset the congestion window when a flow goes idle: on a link that
# is idle most of the time this avoids a slow restart on every burst.
net.ipv4.tcp_slow_start_after_idle = 0

# ---- NAPI / softirq budget -------------------------------------
# netdev_budget is how many packets one NAPI poll may process before the
# softirq yields; netdev_max_backlog is the per-CPU backlog queue depth.
# Both raised from the 300/1000 defaults because the NSS delivery path and
# the USB modem can hand over bursts that the default backlog drops
# (visible as "dropped" in /proc/net/softnet_stat).
net.core.netdev_budget = 2400
net.core.netdev_max_backlog = 16384
# netdev_budget_usecs is intentionally NOT set: on kernel 6.12 it is
# interpreted differently from 6.6 and a large value lets one poll monopolise
# a core. The packet budget above is the safe knob.
net.core.dev_weight = 64

# ---- conntrack -------------------------------------------------
# 32768 is ~4x the flows a home network with a proxy actually holds, and each
# entry is ~300 bytes, so this caps conntrack at ~10 MB.
net.netfilter.nf_conntrack_max = 32768
net.netfilter.nf_conntrack_tcp_timeout_established = 1800
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# ---- ARP / neighbour -------------------------------------------
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# ---- misc ------------------------------------------------------
# A router forwards; it does not accept redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# SYN flood protection lives in fw4 (synflood_protect); the kernel knob only
# turns on syncookies, which is the desired fallback.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 4
net.ipv4.ip_local_port_range = 10240 60999
net.ipv4.tcp_tw_reuse = 1

# IPv6: the router is not a router advertisement daemon here (odhcpd is), and
# it must not accept redirects either.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.all.use_tempaddr = 0
net.ipv6.conf.default.use_tempaddr = 0

# Inotify: LuCI's file manager and the dashboard watch a handful of paths.
fs.inotify.max_user_instances = 128
fs.file-max = 100000
