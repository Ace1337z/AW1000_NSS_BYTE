<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!--
	  AW1000_NSS_BYTE mark: a bold "B" for BYTE.

	  Replaces the OpenWrt ring mark in the Footstrap header and tab favicon.
	  Two paths only, so it stays crisp at 16px (favicon) and at 40px (header):
	  the counter of the B is cut out with fill-rule="evenodd" rather than
	  drawn as a separate shape, which keeps the glyph legible when the whole
	  thing is a few pixels tall.

	  Colours are the theme's own accent pair, so the mark follows the
	  light/dark chrome without a second variant. The stroke uses
	  currentColor so it inherits the header text colour, the way the theme's
	  own .fs-logo-ring does.
	-->
	<path fill-rule="evenodd" fill="#00b5e2"
		d="M18 8h34c13.8 0 22 6.6 22 18.2 0 7.1-3.6 12.4-9.6 15.1 7.9 2.4 12.6 8.5 12.6 17.1C77 71.8 67.6 79 52.4 79H18V8zm17.6 14.6v13.9h13.1c5 0 8-2.6 8-6.9 0-4.4-3-7-8-7h-13.1zm0 27.3v14.5h14.6c5.4 0 8.7-2.8 8.7-7.3 0-4.6-3.3-7.2-8.7-7.2H35.6z"/>
	<path fill="#002b49"
		d="M18 8h8v71h-8z"/>
</svg>
