# AW1000 NSS tuning: read by /etc/init.d/sysctl (START=11) on every boot.
# 12-tcp-bbr.conf from kmod-tcp-bbr only sets the congestion control; this file
# is the complete set so it stays correct if that package is ever dropped.
#
# fq is the pacing qdisc BBR expects. It is the netdev default, so every
# interface (including wwan0_1) gets it without tc calls. The knobs below are
# the ones the kernel exposes through sysctl; fq's per-qdisc parameters
# (flow_limit, quantum, initial_quantum) are tc options, not sysctls - see
# README-BUILD.md for the optional per-interface command.
#
# Note: NSS/PPE offloaded flows bypass the qdisc and the stack sysctls once the
# flow is in hardware. This affects the first packet and the not-offloaded
# paths (modem control, low-rate flows), which is where these settings matter.
net.core.default_qdisc=fq

# BBR + fair queueing, as asked for.
net.ipv4.tcp_congestion_control=bbr

# TCP Fast Open, client and server (3 = both).
net.ipv4.tcp_fastopen=3

# Keep the cwnd after an idle period: a bulk transfer that pauses should not
# restart from a fresh slow start on this link.
net.ipv4.tcp_slow_start_after_idle=0

# SoC receive queues: 16384 is the value the user asked for. 2400 (300
# packets x 8) raises the polling budget per NAPI cycle, which keeps the
# 2.5G/5G-capable ports fed without lengthening latency on idle loops.
net.core.netdev_max_backlog=16384
net.core.netdev_budget=2400
