name: Build AW1000_NSS_BYTE firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build/**
      - aw1000/**
      - byte/**
      - wwan/**
      - net/**
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    name: Build AW1000_NSS_BYTE (OpenWrt NSS, apk) for AW1000
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CI: "1"
      # OpenWrt's CONFIG_CCACHE points ccache here (build.sh moves this
      # directory aside across a re-clone). An explicit path keeps it inside
      # the workspace so actions/cache can find it.
      CCACHE_DIR: ${{ github.workspace }}/work/openwrt/.ccache
      # 2 GB holds the whole toolchain plus most of the target tree. OpenWrt
      # alone produces ~1.5 GB of objects; a smaller cap silently evicts the
      # toolchain between runs and every build starts cold.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      # Relative paths keep the object cache valid across runners, which all
      # check out under /home/runner/work/<repo>/<repo>.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # Restore-only: the caches are uploaded by the explicit save steps at the
      # end of the job, which run even when the build fails. actions/cache's own
      # post-step only saves on success, so a build that failed at minute 200
      # threw away every object file it had compiled.
      #
      # The keys are stable (a hash of the pinned trees), not per-run. A new
      # key on every run makes the cache immutable-and-unreused: every run
      # compiles from scratch, then adds another ~2 GB to the repository's
      # 10 GB cache budget until GitHub starts evicting.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/.ccache
          key: aw1000-nss-byte-ccache-${{ hashFiles('build/versions', 'build/feeds', 'build/config') }}
          restore-keys: |
            aw1000-nss-byte-ccache-

      # dl/ is just the upstream tarballs. It does not depend on this repo, only
      # on the pinned tree, so it gets its own key and is never invalidated by a
      # config edit.
      - name: Restore source archives
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/dl
          key: aw1000-nss-byte-dl-${{ hashFiles('build/versions', 'build/feeds') }}
          restore-keys: |
            aw1000-nss-byte-dl-

      - name: Fetch pinned trees and build
        run: |
          chmod +x build/build.sh build/inside.sh
          ./build/build.sh all 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Whether the ccache is actually being reused is the difference between a
      # 90 minute build and a 4 hour one, and it is otherwise invisible: the
      # make output looks identical either way. Print the hit rate, and make a
      # cache that was restored but never hit fail loudly instead of silently
      # costing three extra hours.
      - name: Report ccache statistics
        if: always()
        run: |
          {
            echo "### ccache";
            echo '```';
            ccache --show-stats 2>/dev/null || echo "ccache not used by this build";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      # Save on failure as well. The step after this one compiles the NSS driver
      # and the kernel, which is where most of the four hours goes; losing the
      # ccache at that point is what turned one failed run into four.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/.ccache
          key: aw1000-nss-byte-ccache-${{ hashFiles('build/versions', 'build/feeds', 'build/config') }}

      - name: Save source archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/dl
          key: aw1000-nss-byte-dl-${{ hashFiles('build/versions', 'build/feeds') }}

      # The whole log, untruncated. This used to keep only the first and last
      # 400 KB of build.log, on the theory that the prepare stage is at the top
      # and the error is at the bottom. That is only true when the failure
      # happens in the last few minutes of a five-hour run. A package that dies
      # at minute 200 lands in the discarded middle, and the tail then shows
      # unrelated successful packages - so the run is unreadable and the fix has
      # to be guessed at instead of read. The file is a few tens of MB
      # uncompressed, well within artifact limits.
      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      # Artifacts and the job log both need API auth to read, which makes a
      # failed run impossible to diagnose from outside the web UI. On failure
      # the full log also goes to a `ci-log` branch, which plain `git fetch`
      # reads. It is gzipped: a 100 MB log pushed raw makes every subsequent
      # `git fetch` of that branch slow, and this branch is re-pointed on each
      # failed run. The artifact above is the unmodified file.
      - name: Publish build log to ci-log branch
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cl
          if [ -f build.log ]; then
            gzip -9 -c build.log > /tmp/cl/build.log.gz
          else
            # A failure before build.sh ever ran (checkout, disk, deps) leaves
            # no build.log at all; say so rather than pushing an empty branch.
            echo "(no build.log produced)" | gzip -9 > /tmp/cl/build.log.gz
          fi
          ls -l /tmp/cl/build.log.gz
          cd /tmp/cl
          git init -q .
          git config user.email "ci@localhost"
          git config user.name "ci"
          git add -A
          git commit -q -m "build log ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log || \
            echo "could not push ci-log branch"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -a work/openwrt/bin/targets/qualcommax/ipq807x/. out/ 2>/dev/null || true
          cp build.log out/build.log 2>/dev/null || true
          ls -l out

      - name: Upload images and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw1000-nss-byte-images
          path: out/*
          if-no-files-found: warn
