name: BYTE AW1000 (NSS) build

# Build the ppe-nss / NSS-offload sysupgrade image for the Arcadyan AW1000 and
# publish it as the release named by ./VERSION ("BYTE 1.0.x", tag BYTE-1.0.x).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - prepare.sh
      - build.sh
      - overlay/**
      - local-feeds/**
      - ci/**
      - .github/workflows/build.yml

permissions:
  contents: write

# One build at a time: two runs would race on the release tag and the cache.
concurrency:
  group: aw1000-nss-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  TZ: UTC
  LC_ALL: C
  # 4 vCPU / 16 GB: 3 is the safe parallelism. OpenWrt LTO + mold eats RAM.
  JOBS: "3"
  # Bound every source fetch. download.pl passes CURL_OPTIONS to curl; without
  # a stall timeout a mirror that accepts the connection then goes quiet hangs
  # the job until GitHub's 6 h cap (this is what killed an earlier run for
  # another tree).
  CURL_OPTIONS: "--max-time 1800 --speed-limit 1024 --speed-time 60"

jobs:
  build:
    name: Build AW1000 NSS image
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Restore downloads
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: aw1000-nss-dl-${{ hashFiles('VERSION', 'prepare.sh', 'ci/bootstrap.sh') }}
          restore-keys: aw1000-nss-dl-

      # prepare.sh expects openwrt/ and builder/ to exist; both are pinned
      # clones, not submodules, so CI fetches them here.
      - name: Bootstrap pinned sources
        run: ./ci/bootstrap.sh

      - name: Prepare feeds, config and overlays
        run: ./prepare.sh

      - name: Build image
        run: ./build.sh

      - name: Verify image and release metadata
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          IMG="$(ls openwrt/bin/targets/qualcommax/ipq807x/*arcadyan_aw1000*squashfs-sysupgrade.bin | head -1)"
          test -n "$IMG" || { echo "::error::no sysupgrade image produced"; exit 1; }
          test -f "releases/BYTE-$VERSION/RELEASE.md" || { echo "::error::no release notes"; exit 1; }
          test -f "releases/BYTE-$VERSION/sha256sums" || { echo "::error::no checksums"; exit 1; }
          ls -l "releases/BYTE-$VERSION"
          echo "IMAGE=$IMG" >>"$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYTE-${{ github.run_number }}-aw1000-nss
          path: |
            releases/BYTE-*/
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          TAG="BYTE-$VERSION"
          NAME="BYTE $VERSION"
          DIR="releases/$TAG"
          test -f "$DIR/RELEASE.md" || { echo "::error::$DIR/RELEASE.md missing"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" "$DIR"/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$NAME" --notes-file "$DIR/RELEASE.md"
          else
            gh release create "$TAG" "$DIR"/* -R "$GITHUB_REPOSITORY" \
              --title "$NAME" --notes-file "$DIR/RELEASE.md"
          fi
          count=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                    --jq '[.assets[] | select(.name | test("squashfs-sysupgrade.bin$"))] | length')
          echo "sysupgrade assets on $TAG: $count"
          test "$count" -ge 1 || { echo "::error::$TAG has no sysupgrade image"; exit 1; }

      # Runs even when the build failed, so the next attempt starts warm.
      - name: Save downloads
        if: always() && steps.cache-dl.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.cache-dl.outputs.cache-primary-key }}
