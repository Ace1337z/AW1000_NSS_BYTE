name: BYTE AW1000 (NSS) build

# Build the ppe-nss / NSS-offload sysupgrade image for the Arcadyan AW1000 and
# publish it as the release named by ./VERSION ("BYTE 1.0.x", tag BYTE-1.0.x).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - prepare.sh
      - build.sh
      - overlay/**
      - local-feeds/**
      - ci/**
      - .github/workflows/build.yml

permissions:
  contents: write

# One build at a time: two runs would race on the release tag and the cache.
concurrency:
  group: aw1000-nss-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  TZ: UTC
  LC_ALL: C
  # 4 vCPU / 16 GB: 4 parallel jobs are safe (LTO + mold stay well under
  # 16 GB at -j4); 3 left one core idle for no memory benefit.
  JOBS: "4"
  # Persist ccache between runs (restored before the build, saved after). An
  # unchanged source set then recompiles almost entirely from cache, which is
  # what keeps repeat runs near the 2 h budget. CCACHE_DIR must match the
  # cache path in the restore/save steps below.
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_MAXSIZE: 2G
  # Bound every source fetch. download.pl passes CURL_OPTIONS to curl; without
  # a stall timeout a mirror that accepts the connection then goes quiet hangs
  # the job until GitHub's 6 h cap (this is what killed an earlier run for
  # another tree).
  CURL_OPTIONS: "--max-time 1800 --speed-limit 1024 --speed-time 60"

jobs:
  build:
    name: Build AW1000 NSS image
    runs-on: ubuntu-24.04
    # A cold world build on 4 vCPU runs ~4 h; 180 min cut two runs off at the
    # 3 h mark (GitHub reports that as conclusion=cancelled, which looks like
    # someone cancelled it). Stay under GitHub's 6 h cap but above the cold
    # build, and let ccache/warm caches bring later runs under 3 h.
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            jq python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            python3-yaml \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Restore downloads
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: aw1000-nss-dl-${{ hashFiles('VERSION', 'prepare.sh', 'ci/bootstrap.sh') }}
          restore-keys: aw1000-nss-dl-

      # prepare.sh expects openwrt/ and builder/ to exist; both are pinned
      # clones, not submodules, so CI fetches them here.
      - name: Bootstrap pinned sources
        run: ./ci/bootstrap.sh

      - name: Prepare feeds, config and overlays
        run: ./prepare.sh

      # Seconds of checking instead of hours of building: config symbols,
      # patch application, overlay staging, script/JSON syntax. Fails the job
      # before the expensive compile if the definition is inconsistent.
      - name: Pre-flight checks
        run: ./ci/preflight.sh

      # ccache is content-addressed, so restoring the most recent cache is
      # always safe even if sources changed: changed files simply miss and are
      # recompiled. The toolchain/host staging cache, on the other hand, is
      # only valid for the exact pinned inputs - no restore-keys fallback, so
      # a pin change rebuilds the toolchain once instead of risking a stale
      # cross-compiler.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: aw1000-nss-ccache-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            aw1000-nss-ccache-${{ runner.os }}-

      - name: Restore toolchain, kernel and host build state
        uses: actions/cache/restore@v4
        with:
          # Only pin-derived state: the cross-toolchain, host tools and the
          # compiled kernel tree. The package/rootfs staging (staging_dir/
          # target-* and build_dir/target-*/root-*) is intentionally NOT
          # cached, so a changed package set can never leak stale files into
          # the image. The -warm- keys are the mid-run checkpoints saved
          # after the smoke phase (see below); they are identical pin-derived
          # state and win over nothing if a full-run save exists.
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
            openwrt/build_dir/target-*/linux-*
          key: aw1000-nss-staging-${{ hashFiles('ci/bootstrap.sh', 'prepare.sh', 'VERSION') }}
          restore-keys: |
            aw1000-nss-staging-warm-${{ hashFiles('ci/bootstrap.sh', 'prepare.sh', 'VERSION') }}

      - name: Smoke build (toolchain, kernel, patched C)
        run: ./build.sh --smoke-only

      # Checkpoint after the expensive-but-fast phase. If the world build
      # later hits the job timeout, the run is terminated before its final
      # cache-save steps run - so this save is what keeps the next attempt
      # from restarting cold. Same pin-derived paths as the final save; a
      # distinct key avoids colliding with it.
      - name: Save warm caches (pre-world checkpoint)
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
            openwrt/build_dir/target-*/linux-*
          key: aw1000-nss-staging-warm-${{ hashFiles('ci/bootstrap.sh', 'prepare.sh', 'VERSION') }}

      - name: Build image (world)
        run: ./build.sh --world-only

      # build.sh drives make with V=s (default verbosity sends every sub-make
      # to /dev/null, which is how a 4 h run failed with "package/X failed to
      # build" and no compiler output at all) and re-runs the failing builddir
      # with V=sc. Keep that log even when the job dies.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aw1000-nss-build-log-${{ github.run_number }}
          path: |
            build.log
            openwrt/.config
          if-no-files-found: warn
          retention-days: 14

      # Save even on failure: the next attempt starts warm. A ccache save
      # uploads the fresh snapshot (unique per run, evicted LRU beyond the
      # 10 GB repo limit); the staging save is keyed on the exact pins and is
      # a no-op when an identical entry already exists.
      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: aw1000-nss-ccache-${{ runner.os }}-${{ github.run_number }}

      - name: Save toolchain, kernel and host build state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
            openwrt/build_dir/target-*/linux-*
          key: aw1000-nss-staging-${{ hashFiles('ci/bootstrap.sh', 'prepare.sh', 'VERSION') }}

      - name: Verify image and release metadata
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          IMG="$(ls openwrt/bin/targets/qualcommax/ipq807x/*arcadyan_aw1000*squashfs-sysupgrade.bin | head -1)"
          test -n "$IMG" || { echo "::error::no sysupgrade image produced"; exit 1; }
          test -f "releases/BYTE-$VERSION/RELEASE.md" || { echo "::error::no release notes"; exit 1; }
          test -f "releases/BYTE-$VERSION/sha256sums" || { echo "::error::no checksums"; exit 1; }
          ls -l "releases/BYTE-$VERSION"
          echo "IMAGE=$IMG" >>"$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYTE-${{ github.run_number }}-aw1000-nss
          path: |
            releases/BYTE-*/
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          TAG="BYTE-$VERSION"
          NAME="BYTE $VERSION"
          DIR="releases/$TAG"
          test -f "$DIR/RELEASE.md" || { echo "::error::$DIR/RELEASE.md missing"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" "$DIR"/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$NAME" --notes-file "$DIR/RELEASE.md"
          else
            gh release create "$TAG" "$DIR"/* -R "$GITHUB_REPOSITORY" \
              --title "$NAME" --notes-file "$DIR/RELEASE.md"
          fi
          count=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                    --jq '[.assets[] | select(.name | test("squashfs-sysupgrade.bin$"))] | length')
          echo "sysupgrade assets on $TAG: $count"
          test "$count" -ge 1 || { echo "::error::$TAG has no sysupgrade image"; exit 1; }

      # Runs even when the build failed, so the next attempt starts warm.
      - name: Save downloads
        if: always() && steps.cache-dl.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.cache-dl.outputs.cache-primary-key }}
